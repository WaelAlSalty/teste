<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartas: Ovos & Salsichas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e272c; color: white; overflow: hidden; }
        
        #lobby-screen { text-align: center; padding: 20px; background: rgba(0,0,0,0.6); border-radius: 15px; width: 90%; max-width: 400px; }
        h1 { font-size: 1.6rem; margin-bottom: 15px; color: #f1c40f; text-shadow: 2px 2px 0 #c0392b; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; margin: 8px; font-weight: bold; width: 100%; max-width: 250px; box-shadow: 0 4px 0 #1e8449; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e8449; }
        
        #btn-start-game { background: #e67e22; box-shadow: 0 4px 0 #d35400; display: none; margin-top: 15px; }

        input { padding: 12px; font-size: 1.2rem; border-radius: 10px; border: 2px solid #7f8c8d; background: #ecf0f1; width: 100%; max-width: 250px; text-align: center; margin-bottom: 10px; color: #333; font-weight: bold;}
        .input-codigo { letter-spacing: 2px; font-size: 1.5rem !important; }
        
        #waiting-msg { display: none; font-size: 1.1rem; color: #bdc3c7; }
        
        /* TELA DO JOGO */
        #game-screen { display: none; flex-direction: column; width: 100%; height: 100%; justify-content: space-between; padding: 10px; background: #27ae60; position: relative; }
        
        /* Cabeçalho de Status dos 3 Jogadores */
        #header-jogadores { display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; font-size: 0.85rem; text-align: center; }
        .jogador-status { padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,0.1); width: 30%; }
        .jogador-status.ativo { background: #f1c40f; color: #000; font-weight: bold; transform: scale(1.05); transition: 0.2s; }

        /* Banner Gigante da Vez */
        #banner-vez { background: rgba(0,0,0,0.6); color: #f1c40f; font-size: 1.2rem; font-weight: bold; text-align: center; padding: 8px; border-radius: 8px; border: 2px solid #f1c40f; }

        /* Mesa Central */
        #mesa-central { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.15); border-radius: 15px; margin: 8px 0; padding: 10px; text-align: center; position: relative; }
        #carta-na-mesa { font-size: 4.5rem; background: white; width: 90px; height: 130px; border-radius: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 15px rgba(0,0,0,0.3); margin-bottom: 8px; border: 3px solid #333; color: #333; }
        #info-mesa { font-size: 1rem; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* Mão de Cartas do Jogador */
        #mao-container { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 15px; }
        #cartas-jogador { display: flex; gap: 10px; justify-content: center; margin-top: 5px; }
        
        .carta { background: #fff; color: #333; width: 70px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 2rem; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 2px solid #bdc3c7; transition: transform 0.2s; user-select: none; }
        .carta:active { transform: translateY(-10px); }

        #botoes-acao { display: none; margin-top: 10px; gap: 10px; }
        .btn-acao { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #btn-duvidar { background: #e74c3c; color: white; }
        #btn-confiar { background: #2ecc71; color: white; }

        #result-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; }
        #result-text { font-size: 2rem; margin-bottom: 20px; color: #f1c40f; }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <h1>Cartas: Ovos & Salsichas 🃏</h1>
        <div id="menu-principal">
            <input type="text" id="nome-input" placeholder="Seu Nome" maxlength="10">
            <br>
            <button onclick="criarSala()">Criar Sala (Host)</button>
            <p style="margin: 8px 0; color: #95a5a6;">ou</p>
            <input type="number" id="codigo-input" class="input-codigo" placeholder="Código (4 dígitos)" maxlength="4">
            <br>
            <button onclick="entrarSala()">Entrar na Sala</button>
        </div>
        <div id="waiting-msg">
            Status: <span id="status-conexao" style="color: #f39c12; font-weight: bold;">Aguardando jogadores (0/2)...</span><br>
            <span id="meu-codigo" style="font-size: 2.2rem; color: #2ecc71; font-weight: bold; display:inline-block; margin-top:10px; letter-spacing: 3px;"></span>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #f39c12;">Passe este código para os outros 2 jogadores!</p>
            
            <button id="btn-start-game" onclick="iniciarPartidaHost()">Iniciar Jogo 🃏</button>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen">
        <!-- Indicador claro dos 3 jogadores -->
        <div id="header-jogadores">
            <div id="status-p1" class="jogador-status"><span id="lbl-p1">P1</span><br><span id="pts-p1">0</span>pts</div>
            <div id="status-p2" class="jogador-status"><span id="lbl-p2">P2</span><br><span id="pts-p2">0</span>pts</div>
            <div id="status-p3" class="jogador-status"><span id="lbl-p3">P3</span><br><span id="pts-p3">0</span>pts</div>
        </div>

        <!-- Banner Gigante indicando quem deve jogar -->
        <div id="banner-vez">Aguardando início...</div>
        
        <!-- Mesa Central -->
        <div id="mesa-central">
            <div id="carta-na-mesa">🎴</div>
            <div id="info-mesa">Aguardando a jogada da rodada...</div>
            
            <div id="botoes-acao">
                <button class="btn-acao" id="btn-confiar" onclick="responderDesafio(true)">Confiar 👍</button>
                <button class="btn-acao" id="btn-duvidar" onclick="responderDesafio(false)">Duvidar! ❌</button>
            </div>
        </div>

        <!-- Mão de Cartas -->
        <div id="mao-container">
            <p style="font-size: 0.85rem; margin-bottom: 4px;">Suas Cartas (Toque para jogar):</p>
            <div id="cartas-jogador"></div>
        </div>

        <div id="result-overlay">
            <div id="result-text">Fim de Jogo!</div>
            <button onclick="location.reload()">Jogar Novamente</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <script>
        let peer;
        let conns = [];
        let hostConn;
        
        let meuNome = "";
        let meuIdNoJogo = 'p1';
        let ehHost = false;
        
        let minhaMao = [];
        let pontuacoes = { p1: 0, p2: 0, p3: 0 };
        let jogadoresNomes = { p1: 'P1', p2: 'P2', p3: 'P3' };
        
        let turnoAtual = 'p1';
        let cartaNaMesaAtual = null;
        let jogadorJogouCarta = null;
        let jogoAtivo = false;

        const lobbyScreen = document.getElementById('lobby-screen');
        const menuPrincipal = document.getElementById('menu-principal');
        const waitingMsg = document.getElementById('waiting-msg');
        const nomeInput = document.getElementById('nome-input');
        const meuCodigoEl = document.getElementById('meu-codigo');
        const statusConexao = document.getElementById('status-conexao');
        const codigoInput = document.getElementById('codigo-input');
        const btnStartGame = document.getElementById('btn-start-game');
        const gameScreen = document.getElementById('game-screen');
        
        const bannerVez = document.getElementById('banner-vez');
        const cartaNaMesaEl = document.getElementById('carta-na-mesa');
        const infoMesa = document.getElementById('info-mesa');
        const cartasJogadorEl = document.getElementById('cartas-jogador');
        const botoesAcao = document.getElementById('botoes-acao');

        const itensPossiveis = ['🥚', '🌭', '🥓'];

        function criarSala() {
            validarNome();
            if(!meuNome) return;
            ehHost = true;
            meuIdNoJogo = 'p1';
            jogadoresNomes.p1 = meuNome;

            const codigoCurto = "card-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(codigoCurto);

            peer.on('open', (id) => {
                meuCodigoEl.innerText = id.replace("card-", "");
                menuPrincipal.style.display = 'none';
                waitingMsg.style.display = 'block';
            });

            peer.on('connection', (connection) => {
                if (conns.length >= 2) { connection.close(); return; }
                conns.push(connection);
                const papelId = 'p' + (conns.length + 1);

                statusConexao.innerText = `Jogadores: ${conns.length + 1}/3`;
                if (conns.length === 2) {
                    statusConexao.style.color = "#2ecc71";
                    statusConexao.innerText = "Sala cheia! Pronto.";
                    btnStartGame.style.display = "inline-block";
                }
                
                connection.on('open', () => {
                    connection.send({ tipo: 'atribuir_papel', papel: papelId, nomes: jogadoresNomes });
                });

                connection.on('data', (data) => {
                    if (data.tipo === 'registrar_nome') {
                        jogadoresNomes[data.papel] = data.nome;
                        transmitirParaTodos({ tipo: 'sincronizar_tudo', nomes: jogadoresNomes, turno: turnoAtual, placares: pontuacoes });
                        atualizarInterfaceGeral();
                    } else if (data.tipo === 'jogar_carta') {
                        processarJogada(data.jogador, data.carta);
                    } else if (data.tipo === 'resposta_desafio') {
                        processarRespostaDesafio(data.jogador, data.confia);
                    }
                });
            });
            peer.on('error', () => { criarSala(); });
        }

        function entrarSala() {
            validarNome();
            if(!meuNome) return;
            const digitado = codigoInput.value.trim();
            if(!digitado) { alert('Digite o código!'); return; }
            
            ehHost = false;
            peer = new Peer();

            peer.on('open', () => {
                hostConn = peer.connect("card-" + digitado);
                hostConn.on('open', () => {
                    menuPrincipal.style.display = 'none';
                    waitingMsg.style.display = 'block';
                    statusConexao.innerText = "Conectado! Aguardando Host iniciar...";
                });
                hostConn.on('data', (data) => {
                    if (data.tipo === 'atribuir_papel') {
                        meuIdNoJogo = data.papel;
                        jogadoresNomes = data.nomes;
                        jogadoresNomes[meuIdNoJogo] = meuNome;
                        hostConn.send({ tipo: 'registrar_nome', papel: meuIdNoJogo, nome: meuNome });
                    } else if (data.tipo === 'iniciar_jogo') {
                        minhaMao = data.maos[meuIdNoJogo];
                        turnoAtual = data.turno;
                        jogadoresNomes = data.nomes;
                        iniciarJogoVisual();
                    } else if (data.tipo === 'sincronizar_tudo') {
                        jogadoresNomes = data.nomes;
                        turnoAtual = data.turno;
                        pontuacoes = data.placares;
                        atualizarInterfaceGeral();
                    } else if (data.tipo === 'mesa_atualizada') {
                        jogadorJogouCarta = data.jogador;
                        cartaNaMesaAtual = data.cartaEscondida;
                        atualizarMesaVisual(data.jogador, '🎴');
                    } else if (data.tipo === 'mudar_turno') {
                        turnoAtual = data.novoTurno;
                        cartaNaMesaAtual = null;
                        jogadorJogouCarta = null;
                        atualizarInterfaceGeral();
                    } else if (data.tipo === 'resultado_desafio') {
                        mostrarResultadoRodada(data.texto);
                    }
                });
            });
        }

        function validarNome() {
            let n = nomeInput.value.trim();
            meuNome = n ? n : '';
            if(!meuNome) alert('Digite seu nome!');
        }

        function iniciarPartidaHost() {
            let maosGerais = {
                p1: [gerarCarta(), gerarCarta(), gerarCarta(), gerarCarta()],
                p2: [gerarCarta(), gerarCarta(), gerarCarta(), gerarCarta()],
                p3: [gerarCarta(), gerarCarta(), gerarCarta(), gerarCarta()]
            };

            turnoAtual = 'p1';
            minhaMao = maosGerais.p1;

            transmitirParaTodos({ tipo: 'iniciar_jogo', maos: maosGerais, turno: turnoAtual, nomes: jogadoresNomes });
            iniciarJogoVisual();
        }

        function gerarCarta() {
            return itensPossiveis[Math.floor(Math.random() * itensPossiveis.length)];
        }

        function iniciarJogoVisual() {
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            jogoAtivo = true;
            atualizarInterfaceGeral();
        }

        function atualizarInterfaceGeral() {
            // Nomes e Placares
            document.getElementById('lbl-p1').innerText = jogadoresNomes.p1 || 'P1';
            document.getElementById('lbl-p2').innerText = jogadoresNomes.p2 || 'P2';
            document.getElementById('lbl-p3').innerText = jogadoresNomes.p3 || 'P3';
            
            document.getElementById('pts-p1').innerText = pontuacoes.p1;
            document.getElementById('pts-p2').innerText = pontuacoes.p2;
            document.getElementById('pts-p3').innerText = pontuacoes.p3;

            // Destacar quem está ativo no topo
            document.getElementById('status-p1').className = 'jogador-status' + (turnoAtual === 'p1' ? ' ativo' : '');
            document.getElementById('status-p2').className = 'jogador-status' + (turnoAtual === 'p2' ? ' ativo' : '');
            document.getElementById('status-p3').className = 'jogador-status' + (turnoAtual === 'p3' ? ' ativo' : '');

            // Banner principal da vez
            if (turnoAtual === meuIdNoJogo) {
                bannerVez.innerText = "👉 É A SUA VEZ DE JOGAR!";
                bannerVez.style.color = "#2ecc71";
            } else {
                let nomeTurno = jogadoresNomes[turnoAtual] || turnoAtual;
                bannerVez.innerText = `⏳ Vez de: ${nomeTurno}`;
                bannerVez.style.color = "#f1c40f";
            }

            atualizarMaoVisual();
        }

        function atualizarMaoVisual() {
            cartasJogadorEl.innerHTML = '';
            minhaMao.forEach((carta, index) => {
                const el = document.createElement('div');
                el.className = 'carta';
                el.innerHTML = `<span>${carta}</span><span style="font-size:0.6rem; color:#7f8c8d">#${index+1}</span>`;
                el.onclick = () => jogarCarta(index);
                cartasJogadorEl.appendChild(el);
            });
        }

        function jogarCarta(index) {
            if (!jogoAtivo) return;
            if (turnoAtual !== meuIdNoJogo) {
                alert('Espere! Não é o seu turno agora.');
                return;
            }
            let cartaEscolhida = minhaMao.splice(index, 1)[0];
            atualizarMaoVisual();

            if (ehHost) {
                processarJogada(meuIdNoJogo, cartaEscolhida);
            } else {
                hostConn.send({ tipo: 'jogar_carta', jogador: meuIdNoJogo, carta: cartaEscolhida });
            }
        }

        function processarJogada(jogador, carta) {
            jogadorJogouCarta = jogador;
            cartaNaMesaAtual = carta;
            
            if (ehHost) {
                transmitirParaTodos({ tipo: 'mesa_atualizada', jogador: jogador, cartaEscondida: '🎴' });
            }
            atualizarMesaVisual(jogador, '🎴');
        }

        function atualizarMesaVisual(jogador, icone) {
            cartaNaMesaEl.innerText = icone;
            let nomeJ = jogadoresNomes[jogador] || jogador;
            infoMesa.innerText = `${nomeJ} jogou uma carta virada para baixo!`;
            
            if (meuIdNoJogo !== jogador) {
                botoesAcao.style.display = 'flex';
                bannerVez.innerText = "⚠️ DECIDA: Confia ou Duvida?";
            } else {
                botoesAcao.style.display = 'none';
                bannerVez.innerText = "🔒 Sua carta está na mesa. Aguarde os outros!";
            }
        }

        function responderDesafio(confia) {
            botoesAcao.style.display = 'none';
            if (ehHost) {
                processarRespostaDesafio(meuIdNoJogo, confia);
            } else {
                hostConn.send({ tipo: 'resposta_desafio', jogador: meuIdNoJogo, confia: confia });
            }
        }

        let respostasRecebidas = 0;
        let alguemDuvidou = false;

        function processarRespostaDesafio(jogadorQueRespondeu, confia) {
            if (!confia) alguemDuvidou = true;
            respostasRecebidas++;

            if (respostasRecebidas >= 2 || !ehHost) {
                respostasRecebidas = 0;
                
                cartaNaMesaEl.innerText = cartaNaMesaAtual;
                let nomeJ = jogadoresNomes[jogadorJogouCarta];
                let textoRes = "";

                if (alguemDuvidou) {
                    textoRes = `${nomeJ} revelou: ${cartaNaMesaAtual}! Alguém duvidou!`;
                } else {
                    textoRes = `${nomeJ} passou a carta ${cartaNaMesaAtual} com sucesso!`;
                    pontuacoes[jogadorJogouCarta] += 10;
                }
                alguemDuvidou = false;

                if (ehHost) {
                    transmitirParaTodos({ tipo: 'resultado_desafio', texto: textoRes });
                }
                mostrarResultadoRodada(textoRes);
            }
        }

        function mostrarResultadoRodada(texto) {
            infoMesa.innerText = texto;
            
            // Avança o turno para o próximo jogador após 3 segundos
            setTimeout(() => {
                if (turnoAtual === 'p1') turnoAtual = 'p2';
                else if (turnoAtual === 'p2') turnoAtual = 'p3';
                else turnoAtual = 'p1';

                cartaNaMesaEl.innerText = '🎴';
                
                if (ehHost) {
                    transmitirParaTodos({ tipo: 'mudar_turno', novoTurno: turnoAtual });
                }
                atualizarInterfaceGeral();
            }, 3500);
        }

        function transmitirParaTodos(dados) {
            conns.forEach(c => { if (c && c.open) c.send(dados); });
        }
    </script>
</body>
</html>
