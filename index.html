<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queda de Ovos e Linguiças</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #2c3e50; color: white; overflow: hidden; }
        
        #lobby-screen { text-align: center; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 15px; width: 90%; max-width: 400px; }
        h1 { font-size: 2rem; margin-bottom: 20px; color: #f1c40f; text-shadow: 2px 2px 0 #c0392b; }
        button { background: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; margin: 10px; transition: 0.2s; font-weight: bold; box-shadow: 0 4px 0 #1e8449; width: 100%; max-width: 250px; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e8449; }
        
        #btn-start-game { background: #e67e22; box-shadow: 0 4px 0 #d35400; display: none; margin-top: 15px; }
        #btn-start-game:active { box-shadow: 0 2px 0 #d35400; }

        input { padding: 15px; font-size: 1.5rem; border-radius: 10px; border: 2px solid #7f8c8d; background: #ecf0f1; width: 100%; max-width: 250px; text-align: center; margin-bottom: 10px; color: #333; letter-spacing: 2px; font-weight: bold;}
        
        #waiting-msg { display: none; font-size: 1.1rem; color: #bdc3c7; }
        
        #game-screen { display: none; flex-direction: column; width: 100%; height: 100%; justify-content: space-between; padding: 15px; background: #1a252f; position: relative; overflow: hidden; }
        
        #header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 10px; z-index: 10; }
        #timer { font-size: 2.2rem; font-weight: bold; color: #e74c3c; width: 70px; text-align: center; }
        
        .scoreboard { display: flex; flex-direction: column; align-items: center; font-size: 0.9rem; }
        .score-val { font-size: 1.8rem; font-weight: bold; color: #f1c40f; }

        #arena { flex: 1; position: relative; width: 100%; margin-top: 10px; border-radius: 10px; background: rgba(0,0,0,0.2); overflow: hidden; cursor: pointer; }
        
        /* Itens caindo na tela */
        .falling-item { position: absolute; font-size: 3rem; user-select: none; animation: cair linear forwards; }
        @keyframes cair {
            0% { transform: translateY(-50px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        #result-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; }
        #result-text { font-size: 2rem; margin-bottom: 20px; color: #f1c40f; }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <h1>Ovos & Linguiças 🥚🌭</h1>
        <div id="menu-principal">
            <button onclick="criarSala()">Criar Sala (Host)</button>
            <p style="margin: 10px 0; color: #95a5a6;">ou</p>
            <input type="number" id="codigo-input" placeholder="Ex: 4321" maxlength="4">
            <br>
            <button onclick="entrarSala()">Entrar na Sala</button>
        </div>
        <div id="waiting-msg">
            Status: <span id="status-conexao" style="color: #f39c12; font-weight: bold;">Aguardando jogadores (0/2)...</span><br>
            <span id="meu-codigo" style="font-size: 2.5rem; color: #2ecc71; font-weight: bold; display:inline-block; margin-top:10px; letter-spacing: 3px;"></span>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #f39c12;">Passe este código de 4 dígitos para os outros!</p>
            
            <button id="btn-start-game" onclick="iniciarPartidaHost()">Iniciar Jogo 🚀</button>
        </div>
    </div>

    <div id="game-screen">
        <div id="header">
            <div id="timer">15</div>
            <div class="scoreboard"><span>Você</span><span id="score-eu" class="score-val">0</span></div>
            <div class="scoreboard"><span>P2</span><span id="score-p2" class="score-val">0</span></div>
            <div class="scoreboard"><span>P3</span><span id="score-p3" class="score-val">0</span></div>
        </div>
        
        <!-- Área onde os ovos e linguiças ficam caindo para tocar -->
        <div id="arena" onclick="clicarNaArena(event)">
            <div id="result-overlay">
                <div id="result-text">Fim de Jogo!</div>
                <button onclick="location.reload()">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <script>
        let peer;
        let conns = [];
        let hostConn;
        
        let meusPontos = 0;
        let placares = { eu: 0, p2: 0, p3: 0 };
        let jogoAtivo = false;
        let ehHost = false;
        let meuIdNoJogo = 'eu';
        let geradorItensInterval;

        const lobbyScreen = document.getElementById('lobby-screen');
        const menuPrincipal = document.getElementById('menu-principal');
        const waitingMsg = document.getElementById('waiting-msg');
        const meuCodigoEl = document.getElementById('meu-codigo');
        const statusConexao = document.getElementById('status-conexao');
        const codigoInput = document.getElementById('codigo-input');
        const btnStartGame = document.getElementById('btn-start-game');
        const gameScreen = document.getElementById('game-screen');
        const timerEl = document.getElementById('timer');
        const arena = document.getElementById('arena');
        const resultOverlay = document.getElementById('result-overlay');
        const resultText = document.getElementById('result-text');

        function criarSala() {
            ehHost = true;
            const codigoCurto = "col-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(codigoCurto);

            peer.on('open', (id) => {
                const codigoLimpo = id.replace("col-", "");
                meuCodigoEl.innerText = codigoLimpo;
                menuPrincipal.style.display = 'none';
                waitingMsg.style.display = 'block';
            });

            peer.on('connection', (connection) => {
                if (conns.length >= 2) {
                    connection.close();
                    return;
                }
                
                conns.push(connection);
                const playerIndex = conns.length + 1;
                
                statusConexao.innerText = `Jogadores conectados: ${conns.length}/2`;
                if (conns.length === 2) {
                    statusConexao.style.color = "#2ecc71";
                    statusConexao.innerText = "Sala cheia! Pronto para iniciar.";
                }

                if (conns.length > 0) {
                    btnStartGame.style.display = "inline-block";
                }
                
                connection.on('open', () => {
                    connection.send({ tipo: 'atribuir_papel', papel: 'p' + playerIndex });
                });

                connection.on('data', (data) => {
                    if (data.tipo === 'ponto') {
                        placares[data.jogador] = data.total;
                        atualizarPlacarTela();
                        transmitirParaTodos({ tipo: 'atualizar_placar', placares });
                    }
                });
            });
            
            peer.on('error', () => { criarSala(); });
        }

        function entrarSala() {
            const digitado = codigoInput.value.trim();
            if(!digitado) { alert('Digite o código de 4 dígitos!'); return; }
            
            const codigoCompleto = "col-" + digitado;
            ehHost = false;
            peer = new Peer();

            peer.on('open', () => {
                hostConn = peer.connect(codigoCompleto);
                
                hostConn.on('open', () => {
                    menuPrincipal.style.display = 'none';
                    waitingMsg.style.display = 'block';
                    statusConexao.innerText = "Conectado!";
                    meuCodigoEl.innerText = "Aguardando o Host iniciar o jogo...";
                });

                hostConn.on('error', () => {
                    alert('Sala não encontrada! Verifique o código.');
                });

                hostConn.on('data', (data) => {
                    if (data.tipo === 'atribuir_papel') {
                        meuIdNoJogo = data.papel;
                    } else if (data.tipo === 'inicio') {
                        iniciarJogoTela();
                    } else if (data.tipo === 'spawn_item') {
                        criarItemNaTela(data.emoji, data.xPercent, data.idItem, data.duracao);
                    } else if (data.tipo === 'tempo') {
                        timerEl.innerText = data.tempo;
                    } else if (data.tipo === 'atualizar_placar') {
                        placares = data.placares;
                        atualizarPlacarTela();
                    } else if (data.tipo === 'fim') {
                        finalizarJogo(data.vencedorTexto);
                    }
                });
            });
        }

        function iniciarPartidaHost() {
            transmitirParaTodos({ tipo: 'inicio' });
            iniciarJogoTela();
            
            // Host gera os itens caindo e avisa todos os celulares/PCs para criarem na mesma posição
            let contadorItens = 0;
            geradorItensInterval = setInterval(() => {
                if (!jogoAtivo) return;
                const emoji = Math.random() > 0.5 ? '🥚' : '🌭';
                const xPercent = Math.floor(Math.random() * 85); // Posição horizontal aleatória
                const idItem = 'item-' + (contadorItens++);
                const duracao = (2 + Math.random() * 1.5).toFixed(2); // Velocidade de queda (entre 2s e 3.5s)
                
                criarItemNaTela(emoji, xPercent, idItem, duracao);
                transmitirParaTodos({ tipo: 'spawn_item', emoji, xPercent, idItem, duracao });
            }, 600); // Cria um item novo a cada 0.6 segundos
            
            let tempo = 15; // 15 segundos de partida
            timerEl.innerText = tempo;
            
            const intervaloTempo = setInterval(() => {
                tempo--;
                timerEl.innerText = tempo;
                transmitirParaTodos({ tipo: 'tempo', tempo });
                
                if (tempo <= 0) {
                    clearInterval(intervaloTempo);
                    clearInterval(geradorItensInterval);
                    jogoAtivo = false;
                    
                    let maxPontos = Math.max(placares.eu, placares.p2, placares.p3);
                    let vencedores = [];
                    if (placares.eu === maxPontos) vencedores.push("Você");
                    if (placares.p2 === maxPontos) vencedores.push("P2");
                    if (placares.p3 === maxPontos) vencedores.push("P3");
                    
                    let textoFinal = vencedores.length > 1 ? "Empate entre: " + vencedores.join(", ") : vencedores[0] + " Venceu! 🏆";
                    
                    finalizarJogo(textoFinal);
                    transmitirParaTodos({ tipo: 'fim', vencedorTexto: textoFinal });
                }
            }, 1000);
        }

        function iniciarJogoTela() {
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            jogoAtivo = true;
        }

        function criarItemNaTela(emoji, xPercent, idItem, duracao) {
            if (!jogoAtivo) return;
            const item = document.createElement('div');
            item.className = 'falling-item';
            item.innerText = emoji;
            item.style.left = xPercent + '%';
            item.style.animationDuration = duracao + 's';
            item.id = idItem;

            // Se o jogador tocar/clicar diretamente no ovo ou linguiça enquanto cai, ganha ponto!
            item.onpointerdown = (e) => {
                e.stopPropagation(); // Evita duplo clique na arena
                if (!jogoAtivo) return;
                
                meusPontos++;
                placares[meuIdNoJogo] = meusPontos;
                atualizarPlacarTela();
                
                // Efeito visual de coleta (some o item na hora)
                item.remove();

                if (ehHost) {
                    transmitirParaTodos({ tipo: 'atualizar_placar', placares });
                } else if (hostConn && hostConn.open) {
                    hostConn.send({ tipo: 'ponto', jogador: meuIdNoJogo, total: meusPontos });
                }
            };

            // Remove o elemento do DOM quando terminar a animação de queda para não travar a memória
            item.onanimationend = () => {
                item.remove();
            };

            arena.appendChild(item);
        }

        function clicarNaArena(e) {
            // Se clicou no espaço vazio da arena não ganha ponto, mas serve para interagir
        }

        function transmitirParaTodos(dados) {
            conns.forEach(c => {
                if (c && c.open) c.send(dados);
            });
        }

        function atualizarPlacarTela() {
            if (meuIdNoJogo === 'eu') {
                document.getElementById('score-eu').innerText = placares.eu;
                document.getElementById('score-p2').innerText = placares.p2;
                document.getElementById('score-p3').innerText = placares.p3;
            } else if (meuIdNoJogo === 'p2') {
                document.getElementById('score-eu').innerText = placares.p2;
                document.getElementById('score-p2').innerText = placares.eu;
                document.getElementById('score-p3').innerText = placares.p3;
            } else if (meuIdNoJogo === 'p3') {
                document.getElementById('score-eu').innerText = placares.p3;
                document.getElementById('score-p2').innerText = placares.eu;
                document.getElementById('score-p3').innerText = placares.p2;
            }
        }

        function finalizarJogo(texto) {
            jogoAtivo = false;
            clearInterval(geradorItensInterval);
            resultOverlay.style.display = 'flex';
            resultText.innerText = texto;
        }
    </script>
</body>
</html>
